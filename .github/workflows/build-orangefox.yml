name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox sync branch"
        required: true
        default: "14.1"
        type: choice
        options:
          - "12.1"
          - "14.1"
      build_type:
        description: "OrangeFox build type"
        required: true
        default: "Unofficial"
        type: choice
        options:
          - Unofficial
          - Beta
          - Stable
      target_boot:
        description: "Target boot image URL to inject the OrangeFox ramdisk into"
        required: true
        default: "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/20260916/boot-ReSukiSU-Reno10-test-WithoutTWRP-Docker-20260916.img"
        type: string
  push:
    branches:
      - twrp-12.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OrangeFox (${{ github.event.inputs.fox_branch || '14.1' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      FOX_BRANCH: ${{ github.event.inputs.fox_branch || '14.1' }}
      FOX_BUILD_TYPE: ${{ github.event.inputs.build_type || 'Unofficial' }}
      DEVICE: taylor
      TARGET_BOOT_URL: ${{ github.event.inputs.target_boot || 'https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/20260916/boot-ReSukiSU-Reno10-test-WithoutTWRP-Docker-20260916.img' }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop patch cpio \
            pngcrush rsync schedtool squashfs-tools unzip xsltproc zip \
            zlib1g-dev openjdk-11-jdk python3 python-is-python3

      - name: Configure git and repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          git config --global --add safe.directory '*'
          mkdir -p "$HOME/.bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod a+rx "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox sources
        run: |
          set -e
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync/sync"
          cd "$HOME/OrangeFox_sync/sync"
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/fox_$FOX_BRANCH"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: fox_${{ env.FOX_BRANCH }}/device/oppo/taylor

      - name: Build OrangeFox
        run: |
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$DEVICE"
          export FOX_BUILD_TYPE="$FOX_BUILD_TYPE"
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export OF_NO_KEYMASTER_VER_4X=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_VANILLA_BUILD=1
          export LC_ALL=C
          cd "$GITHUB_WORKSPACE/fox_$FOX_BRANCH"
          source build/envsetup.sh || true
          lunch twrp_${DEVICE}-eng
          mka adbd bootimage

      - name: Patch target boot with OrangeFox ramdisk
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/fox_$FOX_BRANCH/out/target/product/$DEVICE"
          FOX_BOOT=$(find "$OUT" -maxdepth 1 -name 'OrangeFox-*.img' | head -n1)
          if [ -z "$FOX_BOOT" ]; then FOX_BOOT="$OUT/boot.img"; fi
          if [ ! -f "$FOX_BOOT" ]; then
            echo "OrangeFox boot image not found in $OUT"; exit 1
          fi
          echo "OrangeFox boot: $FOX_BOOT"

          mkdir -p "$HOME/.bin" "$GITHUB_WORKSPACE/artifacts"
          curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk" -o /tmp/magisk.apk
          unzip -o -q /tmp/magisk.apk 'lib/x86_64/libmagiskboot.so' -d /tmp/magisk_apk
          MAGISKBOOT="$HOME/.bin/magiskboot"
          cp /tmp/magisk_apk/lib/x86_64/libmagiskboot.so "$MAGISKBOOT"
          chmod +x "$MAGISKBOOT"

          curl -sL "$TARGET_BOOT_URL" -o /tmp/target-boot.img
          echo "Target boot: $TARGET_BOOT_URL"

          rm -rf /tmp/fox /tmp/target
          mkdir -p /tmp/fox /tmp/target
          cp "$FOX_BOOT" /tmp/fox/fox.img
          ( cd /tmp/fox && "$MAGISKBOOT" unpack fox.img )

          cp /tmp/target-boot.img /tmp/target/target.img
          ( cd /tmp/target && "$MAGISKBOOT" unpack target.img )

          cp /tmp/fox/ramdisk.cpio /tmp/target/ramdisk.cpio
          ( cd /tmp/target && "$MAGISKBOOT" repack target.img "$GITHUB_WORKSPACE/artifacts/boot-orangefox-$DEVICE.img" )

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload patched boot
        uses: actions/upload-artifact@v4
        with:
          name: boot-orangefox-${{ env.DEVICE }}
          path: ${{ github.workspace }}/artifacts/boot-orangefox-${{ env.DEVICE }}.img
          if-no-files-found: error
          compression-level: 0
